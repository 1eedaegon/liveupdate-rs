# cargo-mutants (docs/testing.md): every mutant of the crate's host code must fail a test.
# src/android.rs compiles only for Android, so its mutants never reach the host tests; the emulator
# suite covers every line of it instead.
exclude_globs = ["src/android.rs"]

# These generated mutants are behaviorally identical to the original code: the default driver
# already returns the proposed empty batch, and either vendor-path character is independently
# rejected again by the segment validator below the fast-path check.
exclude_re = [
  'src/driver\.rs:100:9: replace Driver::drain_events -> Result<EventBatch> with Ok\(Default::default\(\)\)',
  'src/presentation\.rs:665:9: replace \|\| with && in valid_app_file',
]
