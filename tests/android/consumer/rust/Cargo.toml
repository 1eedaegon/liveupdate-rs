# The application's Rust code. tests/android/consumer.sh copies this folder and writes the dependency on
# `liveupdate` in place of the line below: the published crate, or this checkout.
[package]
name = "liveupdate-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# A version with action targets and `LiveUpdate::android_from_raw`: the recorder.
targets = []
# A version with `LiveUpdate::open_promotion_settings` (0.9.0).
platform = []
# A version with activities from a push (0.10.0): the crate's native entry, and the server's payload.
push = ["liveupdate/push"]

[dependencies]
jni = { version = "0.22.4", default-features = false }
ndk-context = "0.1.1"
serde_json = "1"
liveupdate = { path = "../../../..", features = ["android"] } # LIVEUPDATE

[workspace]
