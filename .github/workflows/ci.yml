name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - run: rustup default 1.96.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: sh tests/android_env.sh
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo check --locked --target aarch64-linux-android --features android
      - run: cargo check --locked --target x86_64-linux-android --features android
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --locked --summary-only --fail-under-lines 80
      - run: cargo package --locked

  android:
    name: Android API 37
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: android --sdk="$ANDROID_SDK_ROOT" sdk install platforms/android-37 ndk/27.3.13750724
      - run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.4"
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: rustup default 1.96.0
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: gradle :android:testDebugUnitTest :android:lintDebug :android:assembleRelease --no-daemon
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_9_pro_xl
          disable-animations: true
          script: gradle :android:coverageVerification --no-daemon

  msrv:
    name: Rust 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 test --locked --all-targets
