[package]
name = "liveupdate"
version = "0.1.0-alpha.1"
description = "Android Live Updates from Rust"
authors = ["1eedaegon"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1eedaegon/liveupdate-rs"
readme = "README.md"
keywords = ["android", "live-updates", "notifications", "jni", "rust"]
categories = ["api-bindings", "os::android-apis"]
include = [
    "/.envrc",
    "/src/**",
    "/scripts/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/flake.lock",
    "/flake.nix",
    "/LICENSE-*",
    "/README.md",
    "/docs/**",
]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
