[package]
name = "liveupdate"
version = "0.2.1"
description = "Android Live Updates from Rust"
authors = ["1eedaegon"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1eedaegon/liveupdate-rs"
readme = "README.md"
keywords = ["android", "live-updates", "notifications", "jni", "rust"]
categories = ["api-bindings", "os::android-apis"]
include = [
    "/.envrc",
    "/android/build.gradle.kts",
    "/android/consumer-rules.pro",
    "/android/src/main/**",
    "/build.gradle.kts",
    "/CHANGELOG.md",
    "/src/**",
    "/scripts/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/flake.lock",
    "/flake.nix",
    "/gradle.properties",
    "/LICENSE-*",
    "/README.md",
    "/settings.gradle.kts",
    "/docs/**",
    "/examples/**",
    "/tools/**",
]

[[example]]
name = "delivery"
crate-type = ["lib"]
required-features = ["android"]

[features]
default = []
android = ["dep:jni", "dep:ndk-context"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false, optional = true }
ndk-context = { version = "0.1.1", optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
